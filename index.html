html{font-size:14px}

input,select,textarea,button{font-family:'Heebo',sans-serif;font-size:.88rem}
input,select,textarea{width:100%;padding:9px 11px;background:var(--bg);border:1px solid var(--brd);border-radius:10px;color:var(--txt);outline:none}

.btn-p{background:var(--pri);color:#000}.btn-p:active{background:var(--priD)}
.btn-d{background:var(--dan);color:#fff}

.nav button.a{color:var(--pri);background:rgba(245,166,35,.1)}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}

.mo{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;display:flex;align-items:flex-end;justify-content:center}
.md{background:var(--sf);width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px;animation:su .25s}

// STORAGE & HELPERS
function ld(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){
  try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}
  if(fbDB){
    const fbKey=k.replace(/^vnb\d+_/,"");
    try{fbDB.ref("vnb/"+fbKey).set(v)}catch(e){console.log("FB save err:",e)}
  }
}
const fmt=n=>`₪${(n||0).toLocaleString("he-IL",{minimumFractionDigits:0,maximumFractionDigits:0})}`;
const fmtD=d=>d?new Date(d+"T00:00:00").toLocaleDateString("he-IL"):"—";
const nxId=a=>(a.length?Math.max(...a.map(x=>x.id))+1:1);

function calcItemTotal(item, products){
  const p=products.find(x=>x.id===item.productId);
  if(!p)return 0;
  if(item.unitType==="box") return item.qty * item.price;
  return item.qty * p.boxesPerCarton * item.price;
}
function calcSaleTotal(sale,prods){return sale.items.reduce((s,i)=>s+calcItemTotal(i,prods),0)}
function calcVat(n){return Math.round(n*(1+VAT))}

function sendWhatsApp(phone, text){
  const p=phone.replace(/[^0-9]/g,"");
  const intl=p.startsWith("0")?"972"+p.slice(1):p;
  window.open(`https://wa.me/${intl}?text=${encodeURIComponent(text)}`,"_blank");
}
function sendEmail(to,subject,body){
  window.open(`mailto:${to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`,"_blank");
}

function App(){
  const[tab,setTab]=useState("dashboard");
  const[products,setProducts]=useState(()=>ld("vnb13_products",DP));
  const[inventory,setInventory]=useState(()=>ld("vnb13_inventory",DI));
  const[customers,setCustomers]=useState(()=>ld("vnb13_customers",DC));
  const[sales,setSales]=useState(()=>ld("vnb13_sales",DS));
  const[leads,setLeads]=useState(()=>ld("vnb13_leads",DL));
  const[expenses,setExpenses]=useState(()=>ld("vnb13_expenses",DE));
  const[orders,setOrders]=useState(()=>ld("vnb13_orders",DO));
  const[tasks,setTasks]=useState(()=>ld("vnb13_tasks",[]));
  const[clusters,setClusters]=useState(()=>ld("vnb13_clusters",[{name:"פזורה",cities:["רהט","חורה","לקיה","כסייפה","שגב שלום","תל שבע","ערד"]},{name:"שפלה",cities:["רמלה","לוד","גדרה","יבנה","נס ציונה","רחובות","מודיעין","בית שמש"]}]));
  const[modal,setModal]=useState(null);
  const[editItem,setEditItem]=useState(null);
  const[pp,setPp]=useState("month");

  // Firebase real-time sync (FIXED - load before save, no version overwrite)
  const[fbLoaded,setFbLoaded]=useState(false);
  useEffect(()=>{
    if(!fbDB){setFbLoaded(true);return}
    
    // Initial load from Firebase - source of truth
    fbDB.ref("vnb").once("value").then(snap=>{
      const d=snap.val();
      const hasData = d && (
        (Array.isArray(d.products)&&d.products.length>0) ||
        (Array.isArray(d.customers)&&d.customers.length>0) ||
        (Array.isArray(d.sales)&&d.sales.length>0) ||
        (Array.isArray(d.orders)&&d.orders.length>0)
      );
      if(hasData){
        // Firebase has real data - load it (it's the source of truth)
        if(Array.isArray(d.products))setProducts(d.products);
        if(Array.isArray(d.inventory))setInventory(d.inventory);
        if(Array.isArray(d.customers))setCustomers(d.customers);
        if(Array.isArray(d.sales))setSales(d.sales);
        if(Array.isArray(d.leads))setLeads(d.leads);
        if(Array.isArray(d.expenses))setExpenses(d.expenses);
        if(Array.isArray(d.orders))setOrders(d.orders);
        if(Array.isArray(d.tasks))setTasks(d.tasks);
        if(Array.isArray(d.clusters))setClusters(d.clusters);
        console.log("✅ Loaded from Firebase");
      } else {
        // Firebase is empty - one-time bootstrap from code defaults
        console.log("🔄 Firebase empty, bootstrapping from defaults");
        const allData={products,inventory,customers,sales,leads,expenses,orders,tasks,clusters};
        fbDB.ref("vnb").set(allData).then(()=>console.log("✅ Bootstrap complete"));
      }
      // Only AFTER load completes - enable auto-save
      setFbLoaded(true);
    }).catch(e=>{
      console.log("FB load err:",e);
      setFbLoaded(true); // fall back to localStorage
    });
    
    // Listen for real-time changes from other devices
    let firstLoad=true;
    fbDB.ref("vnb").on("value",snap=>{
      if(firstLoad){firstLoad=false;return}
      const d=snap.val();
      if(!d)return;
      if(Array.isArray(d.products))setProducts(p=>JSON.stringify(p)!==JSON.stringify(d.products)?d.products:p);
      if(Array.isArray(d.inventory))setInventory(p=>JSON.stringify(p)!==JSON.stringify(d.inventory)?d.inventory:p);
      if(Array.isArray(d.customers))setCustomers(p=>JSON.stringify(p)!==JSON.stringify(d.customers)?d.customers:p);
      if(Array.isArray(d.sales))setSales(p=>JSON.stringify(p)!==JSON.stringify(d.sales)?d.sales:p);
      if(Array.isArray(d.leads))setLeads(p=>JSON.stringify(p)!==JSON.stringify(d.leads)?d.leads:p);
      if(Array.isArray(d.expenses))setExpenses(p=>JSON.stringify(p)!==JSON.stringify(d.expenses)?d.expenses:p);
      if(Array.isArray(d.orders))setOrders(p=>JSON.stringify(p)!==JSON.stringify(d.orders)?d.orders:p);
      if(Array.isArray(d.tasks))setTasks(p=>JSON.stringify(p)!==JSON.stringify(d.tasks)?d.tasks:p);
      if(Array.isArray(d.clusters))setClusters(p=>JSON.stringify(p)!==JSON.stringify(d.clusters)?d.clusters:p);
    });
  },[]);
  
  // Auto-save - ONLY after Firebase finished loading (prevents overwriting real data with defaults)
  useEffect(()=>{if(fbLoaded)sv("vnb13_products",products)},[products,fbLoaded]);
  useEffect(()=>{if(fbLoaded)sv("vnb13_inventory",inventory)},[inventory,fbLoaded]);
  useEffect(()=>{if(fbLoaded)sv("vnb13_customers",customers)},[customers,fbLoaded]);
  useEffect(()=>{if(fbLoaded)sv("vnb13_sales",sales)},[sales,fbLoaded]);
  useEffect(()=>{if(fbLoaded)sv("vnb13_leads",leads)},[leads,fbLoaded]);
  useEffect(()=>{if(fbLoaded)sv("vnb13_expenses",expenses)},[expenses,fbLoaded]);
  useEffect(()=>{if(fbLoaded)sv("vnb13_orders",orders)},[orders,fbLoaded]);
  useEffect(()=>{if(fbLoaded)sv("vnb13_tasks",tasks)},[tasks,fbLoaded]);
  useEffect(()=>{if(fbLoaded)sv("vnb13_clusters",clusters)},[clusters,fbLoaded]);

  // Auto daily backup
  useEffect(()=>{
    const today=new Date().toISOString().split("T")[0];
    if(localStorage.getItem("vnb13_lb")!==today){
      const b=ld("vnb13_bk",[]);
      b.unshift({date:new Date().toISOString(),type:"auto",data:{products,inventory,customers,sales,leads,expenses,orders}});
      while(b.length>7)b.pop();sv("vnb13_bk",b);localStorage.setItem("vnb13_lb",today);
    }
  },[]);

  // Follow-up reminders check
  const reminders=useMemo(()=>{
    const today=new Date().toISOString().split("T")[0];
    const r=[];
    leads.forEach(l=>{if(l.followUp&&l.followUp<=today)r.push({type:"lead",name:l.name,date:l.followUp})});
    customers.forEach(c=>{if(c.visits&&c.visits.length>0){const last=c.visits[c.visits.length-1];if(last.nextVisit&&last.nextVisit<=today)r.push({type:"customer",name:c.name,date:last.nextVisit})}});
    return r;
  },[leads,customers]);

  const gc=id=>customers.find(c=>c.id===id);
  const gp=id=>products.find(p=>p.id===id);

  // Totals
  const totBV=useMemo(()=>sales.reduce((s,sl)=>s+calcSaleTotal(sl,products),0),[sales,products]);
  const totV=useMemo(()=>calcVat(totBV),[totBV]);
  const unpaid=useMemo(()=>sales.filter(s=>s.status!=="שולם"),[sales]);
  const unpaidT=useMemo(()=>unpaid.reduce((s,sl)=>{const t=calcVat(calcSaleTotal(sl,products));return s+t-(sl.paid||0)},0),[unpaid,products]);

  // Period profit
  const pData=useMemo(()=>{
    const now=new Date();
    const fd=d=>{const dt=new Date(d);if(pp==="month")return dt.getMonth()===now.getMonth()&&dt.getFullYear()===now.getFullYear();return dt.getFullYear()===now.getFullYear()};
    const pS=sales.filter(s=>fd(s.date));const pE=expenses.filter(e=>fd(e.date));
    const rev=pS.reduce((s,sl)=>s+calcSaleTotal(sl,products),0);
    const exp=pE.reduce((s,e)=>s+e.amount,0);
    return{rev,exp,profit:rev-exp,margin:rev>0?((rev-exp)/rev*100):0};
  },[sales,expenses,products,pp]);

  // Stock from inventory
  const stockData=useMemo(()=>products.map(p=>{
    const pallets=inventory.find(i=>i.productId===p.id&&i.warehouse==="pallets")?.qty||0;
    const cartons=inventory.find(i=>i.productId===p.id&&i.warehouse==="cartons")?.qty||0;
    return{...p,pallets,cartons,low:cartons<p.minStock&&pallets===0};
  }),[products,inventory]);

  const openEdit=(type,item)=>{setEditItem(item);setModal(type)};
  const openNew=type=>{setEditItem(null);setModal(type)};

  // Export/Import
  const expD=()=>{
    const d={products,inventory,customers,sales,leads,expenses,orders};
    const b=new Blob([JSON.stringify(d,null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(b);
    a.download=`vnb-backup-${new Date().toISOString().split("T")[0]}.json`;a.click();
  };
  const impD=e=>{
    const f=e.target.files[0];if(!f)return;
    if(!confirm("לטעון גיבוי? גיבוי נוכחי יישמר.")){e.target.value="";return}
    const bk=ld("vnb13_bk",[]);bk.unshift({date:new Date().toISOString(),type:"pre-import",data:{products,inventory,customers,sales,leads,expenses,orders}});
    while(bk.length>7)bk.pop();sv("vnb13_bk",bk);
    const r=new FileReader();r.onload=ev=>{try{
      const d=JSON.parse(ev.target.result);
      if(d.products)setProducts(d.products);if(d.inventory)setInventory(d.inventory);
      if(d.customers)setCustomers(d.customers);if(d.sales)setSales(d.sales);
      if(d.leads)setLeads(d.leads);if(d.expenses)setExpenses(d.expenses);
      if(d.orders)setOrders(d.orders||[]);
      alert("נטען בהצלחה!");
    }catch(err){alert("שגיאה")}};r.readAsText(f);e.target.value="";
  };
  const restoreB=idx=>{
    const b=ld("vnb13_bk",[]);if(!b[idx])return;
    if(!confirm(`לשחזר גיבוי מ-${new Date(b[idx].date).toLocaleString("he-IL")}?`))return;
    const d=b[idx].data;
    if(d.products)setProducts(d.products);if(d.inventory)setInventory(d.inventory);
    if(d.customers)setCustomers(d.customers);if(d.sales)setSales(d.sales);
    if(d.leads)setLeads(d.leads);if(d.expenses)setExpenses(d.expenses);
    if(d.orders)setOrders(d.orders||[]);setModal(null);alert("שוחזר!");
  };

  const tabs=[
    {id:"dashboard",l:"ראשי",i:"🏠"},{id:"inventory",l:"מלאי",i:"📦"},
    {id:"sales",l:"מכירות",i:"💰"},{id:"orders",l:"הזמנות",i:"📋"},
    {id:"geo",l:"גיאוגרפי",i:"🗺️"},{id:"customers",l:"לקוחות",i:"👥"},
    {id:"leads",l:"לידים",i:"🎯"},{id:"tasks",l:"משימות",i:"✅"},
    {id:"expenses",l:"הוצאות",i:"💳"},{id:"calendar",l:"יומן",i:"📅"},
    {id:"reports",l:"דוחות",i:"📊"},{id:"settings",l:"הגדרות",i:"⚙️"},
  ];

  // ======================== DASHBOARD ========================
  const Dashboard=()=>{
    const recent=[...sales].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
    return(<div className="fi">
      {reminders.length>0&&<div className="card" style={{borderColor:"var(--warn)",marginBottom:8}}>
        <div style={{fontWeight:700,color:"var(--warn)",marginBottom:4}}>🔔 תזכורות מעקב</div>

          <button onClick={()=>{
            if(r.type==="lead")setLeads(p=>p.map(l=>l.name===r.name?{...l,followUp:""}:l));
            else setCustomers(p=>p.map(c=>c.name===r.name?{...c,visits:(c.visits||[]).map((v,vi,arr)=>vi===arr.length-1?{...v,nextVisit:""}:v)}:c));
          }} style={{background:"none",border:"none",cursor:"pointer",fontSize:".7rem",color:"var(--txt3)"}}>✕</button>

      <div className="sc" style={{background:"linear-gradient(135deg,#1a2a1a,#1a1f2b)",marginBottom:8}}>

      <h3 style={{fontWeight:700,marginBottom:6,fontSize:".9rem"}}>💳 גבייה</h3>

        </>)
      })()}
      <h3 style={{fontWeight:700,marginBottom:6,marginTop:8,fontSize:".9rem"}}>📅 אירועים להיום</h3>
      {(()=>{const today=new Date().toISOString().split("T")[0];
        const todayEvents=[];
        orders.forEach(o=>{if(o.expectedDate===today&&o.status!=="סופק"){const c=gc(o.customerId);todayEvents.push({icon:"🚚",label:`אספקה: ${c?.name||"—"}`,tab:"orders"})}});
        customers.forEach(c=>(c.visits||[]).forEach(v=>{if(v.date===today)todayEvents.push({icon:"👥",label:`ביקור: ${c.name}`,tab:"customers"});if(v.nextVisit===today)todayEvents.push({icon:"🔄",label:`ביקור הבא: ${c.name}`})}));

        tasks.filter(t=>!t.done&&t.date===today).forEach(t=>todayEvents.push({icon:"✅",label:t.text,tab:"tasks"}));

  // ======================== INVENTORY ========================
  const Inventory=()=>{
    const[fl,setFl]=useState("all");
    const[editCPP,setEditCPP]=useState(null); // cartons per pallet edit
    const soldData=useMemo(()=>{
      const m={};
      sales.forEach(s=>s.items.forEach(i=>{
        if(!m[i.productId])m[i.productId]=0;
        const p=gp(i.productId);if(!p)return;
        if(i.unitType==="box")m[i.productId]+=+i.qty;
        else m[i.productId]+=(+i.qty)*(p.boxesPerCarton);
      }));
      return m;
    },[sales,products]);
    const openPallet=(pid,e)=>{
      e.stopPropagation();
      const p=gp(pid);if(!p)return;
      const cpp=p.cartonsPerPallet||p.boxesPerCarton;
      const inv=[...inventory];
      const pi=inv.findIndex(x=>x.productId===pid&&x.warehouse==="pallets");
      const ci=inv.findIndex(x=>x.productId===pid&&x.warehouse==="cartons");
      if(pi===-1||inv[pi].qty<=0){alert("אין משטחים לפתוח");return}
      if(!confirm(`לפתוח משטח של ${p.name}?\nיתווספו ${cpp} קרטונים`))return;
      inv[pi]={...inv[pi],qty:inv[pi].qty-1};
      if(ci!==-1)inv[ci]={...inv[ci],qty:inv[ci].qty+cpp};
      setInventory(inv);
    };
    const updateCPP=(pid,val)=>{
      setProducts(prev=>prev.map(p=>p.id===pid?{...p,cartonsPerPallet:+val}:p));
      setEditCPP(null);
    };
    return(<div className="fi">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <h3 style={{fontWeight:700}}>📦 מלאי</h3>
        <button className="btn btn-p btn-sm" onClick={()=>openNew("product")}>+ מוצר</button>
      </div>
      <div className="tb">{[["all","הכל"],["pallets","🏗️ משטחים"],["cartons","📦 קרטונים"]].map(([k,l])=>
        <button key={k} className={fl===k?"a":""} onClick={()=>setFl(k)}>{l}</button>)}</div>
      {stockData.map(p=>{
        const showP=fl==="all"||fl==="pallets";const showC=fl==="all"||fl==="cartons";
        const cpp=p.cartonsPerPallet||p.boxesPerCarton;
        const soldBoxes=soldData[p.id]||0;
        const soldCartons=Math.floor(soldBoxes/p.boxesPerCarton);
        const palletCartons=p.pallets*cpp;
        const totalCartons=palletCartons+p.cartons;
        const balance=totalCartons-soldCartons;
        return(<div className="card" key={p.id} style={{borderColor:p.low?"var(--dan)":"var(--brd)"}} onClick={()=>openEdit("product",p)}>
          <div style={{fontWeight:700,fontSize:".88rem"}}>{p.name}</div>
          <div style={{fontSize:".68rem",color:"var(--txt3)",marginBottom:4}}>{p.boxesPerCarton} קופ\'/קרטון | {cpp} קרט\'/משטח | מכירה: {fmt(p.pricePerBox)}</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:4}}>
            {showP&&<div style={{background:"var(--bg)",padding:6,borderRadius:8,textAlign:"center"}}>
              <div style={{fontSize:".64rem",color:"var(--txt3)"}}>🏗️ משטחים</div>
              <div style={{fontWeight:800,fontSize:"1.1rem",color:"var(--pur)"}}>{p.pallets}</div>
              <div style={{fontSize:".62rem",color:"var(--txt3)"}}>= {palletCartons} קרטונים</div>
              <div style={{display:"flex",gap:2,justifyContent:"center",marginTop:3}}>
                {p.pallets>0&&<button className="btn btn-o" style={{fontSize:".58rem",padding:"1px 5px"}} onClick={(e)=>openPallet(p.id,e)}>פתח</button>}
                <button className="btn btn-o" style={{fontSize:".58rem",padding:"1px 5px"}} onClick={(e)=>{e.stopPropagation();setEditCPP(editCPP===p.id?null:p.id)}}>{cpp}/מש\' ✏️</button>
              </div>
              {editCPP===p.id&&<div style={{marginTop:4}} onClick={e=>e.stopPropagation()}>
                <input type="number" defaultValue={cpp} style={{width:50,fontSize:".7rem",textAlign:"center"}} onBlur={e=>updateCPP(p.id,e.target.value)} onKeyDown={e=>{if(e.key==="Enter")updateCPP(p.id,e.target.value)}}/>
              </div>}
            </div>}
            {showC&&<div style={{background:"var(--bg)",padding:6,borderRadius:8,textAlign:"center"}}>
              <div style={{fontSize:".64rem",color:"var(--txt3)"}}>📦 קרטונים (פתוחים)</div>
              <div style={{fontWeight:800,fontSize:"1.1rem",color:p.low?"var(--dan)":"var(--suc)"}}>{p.cartons}</div>
            </div>}
          </div>
          <div style={{background:"var(--bg)",padding:6,borderRadius:8,marginTop:4}}>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:".72rem"}}>
              <span>סה"כ קרטונים:</span><strong>{totalCartons}</strong>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:".72rem",color:"var(--dan)"}}>
              <span>נמכרו:</span><strong>{soldCartons}</strong>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:".78rem",fontWeight:700,color:balance<=0?"var(--dan)":"var(--suc)",borderTop:"1px solid var(--brd)",paddingTop:3,marginTop:3}}>
              <span>יתרה:</span><span>{balance} קרטונים</span>
            </div>
          </div>
          {p.low&&<div style={{marginTop:2,fontSize:".72rem",color:"var(--dan)",fontWeight:600}}>⚠️ מלאי נמוך!</div>}
        </div>)
      })}
    </div>);
  };

  // ======================== SALES ========================
  const Sales=()=>{
    const[sr,setSr]=useState("");const[fl,setFl]=useState("all");const[docFl,setDocFl]=useState("all");
    const[openMonth,setOpenMonth]=useState(()=>{const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}`});
    const sorted=useMemo(()=>{
      let r=[...sales].sort((a,b)=>b.date.localeCompare(a.date));
      if(fl==="paid")r=r.filter(s=>s.status==="שולם");
      if(fl==="unpaid")r=r.filter(s=>s.status!=="שולם");
      if(fl==="partial")r=r.filter(s=>s.status==="חלקי");
      if(docFl==="noInvoice")r=r.filter(s=>!s.invoiceSent);else if(docFl!=="all")r=r.filter(s=>s.docType===docFl);
      if(sr)r=r.filter(s=>{const c=gc(s.customerId);return c?.name.includes(sr)});
      return r;
    },[sales,sr,fl,docFl]);
    const months=useMemo(()=>{
      const m={};sorted.forEach(s=>{const k=s.date.slice(0,7);if(!m[k])m[k]=[];m[k].push(s)});
      return Object.entries(m).sort((a,b)=>b[0].localeCompare(a[0]));
    },[sorted]);
    const monthNames={"01":"ינואר","02":"פברואר","03":"מרץ","04":"אפריל","05":"מאי","06":"יוני","07":"יולי","08":"אוגוסט","09":"ספטמבר","10":"אוקטובר","11":"נובמבר","12":"דצמבר"};
    return(<div className="fi">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <h3 style={{fontWeight:700}}>💰 מכירות ({sales.length})</h3>
        <button className="btn btn-p btn-sm" onClick={()=>openNew("sale")}>+ מכירה</button>
      </div>
      <div className="sr"><input value={sr} onChange={e=>setSr(e.target.value)} placeholder="חיפוש לקוח..."/><span className="ic">🔍</span></div>
      <div className="tb">{[["all","הכל"],["unpaid","ממתין"],["partial","חלקי"],["paid","שולם"]].map(([k,l])=>
        <button key={k} className={fl===k?"a":""} onClick={()=>setFl(k)}>{l}</button>)}</div>
      <div className="tb" style={{marginBottom:4}}>{[["all","כל המסמכים"],["חשבונית","חשבונית"],["noInvoice","ללא חשב\'"]].map(([k,l])=>
        <button key={k} className={docFl===k?"a":""} onClick={()=>setDocFl(k)}>{l}</button>)}</div>
      {months.map(([month,items])=>{
        const mTotal=items.reduce((s,sl)=>s+calcVat(calcSaleTotal(sl,products)),0);
        const isOpen=openMonth===month;
        return(<div key={month}>
          <div onClick={()=>setOpenMonth(isOpen?null:month)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 6px",background:"var(--bg)",borderRadius:8,marginBottom:4,cursor:"pointer",borderRight:isOpen?"3px solid var(--pri)":"3px solid transparent"}}>
            <span style={{fontWeight:700,fontSize:".85rem"}}>{monthNames[month.slice(5)]||month.slice(5)} {month.slice(0,4)}</span>
            <span style={{display:"flex",gap:8,alignItems:"center"}}><span style={{fontSize:".72rem",color:"var(--txt3)"}}>{items.length} מכירות</span><strong style={{color:"var(--suc)",fontSize:".85rem"}}>{fmt(mTotal)}</strong><span>{isOpen?"▲":"▼"}</span></span>
          </div>
          {isOpen&&items.map(s=>{const c=gc(s.customerId);const t=calcSaleTotal(s,products);
            return(<div className="row" key={s.id} onClick={()=>openEdit("sale",s)}>
              <div><div style={{fontWeight:600}}>{c?.name||"—"}</div>
                <div style={{fontSize:".68rem",color:"var(--txt3)"}}>{s.date}{s.docType&&s.docType!=="ללא"?` • ${s.docType}`:""}{s.invoiceNum?` • מס\'${s.invoiceNum}`:""}{s.payMethod&&s.payMethod!=="מזומן"?` • ${s.payMethod}`:""}{s.moneyDest&&s.moneyDest!=="אצלי"?` • ${s.moneyDest}`:""}{s.notes?` • ${s.notes.slice(0,18)}`:""}</div>
                {s.status==="חלקי"&&<div style={{fontSize:".62rem",color:"var(--warn)"}}>💰 שולם {fmt(+s.paid)} | יתרה {fmt(calcVat(calcSaleTotal(s,products))-(+s.paid))}</div>}
                {(s.invoiceSent||s.receiptSent)&&<div style={{fontSize:".62rem",display:"flex",gap:2}}>{s.invoiceSent&&<span style={{color:"var(--suc)"}}>✓חשב</span>}{s.receiptSent&&<span style={{color:"var(--suc)"}}>✓קבלה</span>}</div>}</div>
              <div style={{textAlign:"left"}}><div style={{fontWeight:700}}>{fmt(t)}</div>
                <span className={`badge ${s.status==="שולם"?"b-s":s.status==="חלקי"?"b-w":"b-d"}`}>{s.status}</span></div>
            </div>)
          })}
        </div>)
      })}
      {sorted.length===0&&<div className="emp">אין מכירות</div>}
    </div>);
  };

  // ======================== ORDERS ========================
  const Orders=()=>{
    const[fl,setFl]=useState("all");
    const sorted=useMemo(()=>{
      let r=[...orders].sort((a,b)=>a.date.localeCompare(b.date));
      if(fl==="open")r=r.filter(o=>o.status!=="סופק");
      if(fl==="done")r=r.filter(o=>o.status==="סופק");
      return r;
    },[orders,fl]);
    const sb=s=>({"ממתין":"b-w","בהכנה":"b-i","נשלח":"b-p","סופק":"b-s"}[s]||"b-w");
    // Summary: quantities by product + total cost
    const openOrders=orders.filter(o=>o.status!=="סופק");
    const orderSummary=useMemo(()=>{
      const m={};let total=0;
      openOrders.forEach(o=>o.items.forEach(i=>{
        if(+i.qty===0)return;
        const p=gp(i.productId);if(!p)return;
        if(!m[i.productId])m[i.productId]={name:p.name,cartons:0,boxes:0};
        if(i.unitType==="box")m[i.productId].boxes+=+i.qty;
        else m[i.productId].cartons+=+i.qty;
        total+=calcItemTotal(i,products);
      }));
      return{items:Object.values(m).filter(x=>x.cartons>0||x.boxes>0),total};
    },[openOrders,products]);
    return(<div className="fi">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <h3 style={{fontWeight:700}}>📋 הזמנות ({orders.length})</h3>
        <button className="btn btn-p btn-sm" onClick={()=>openNew("order")}>+ הזמנה</button>
        <button className="btn btn-o btn-sm" onClick={()=>{
          const openO=orders.filter(o=>o.status!=="סופק");
          const cargo={};
          openO.forEach(o=>o.items.forEach(i=>{
            if(+i.qty<=0)return;const p=gp(+i.productId);if(!p)return;
            const k=p.name;if(!cargo[k])cargo[k]={boxes:0,cartons:0};
            if(i.unitType==="box")cargo[k].boxes+=+i.qty;
            else cargo[k].cartons+=+i.qty;
          }));
          let txt="📦 *רשימת סחורה להזמנות פתוחות:*\n\n";
          Object.entries(cargo).forEach(([name,q])=>{
            txt+=`${name}: ${q.cartons>0?q.cartons+" קרט\'":""}${q.boxes>0?" "+q.boxes+" קופ\'":""}\n`;
          });
          txt+=`\nסה"כ ${openO.length} הזמנות`;
          navigator.clipboard.writeText(txt).then(()=>alert("רשימת סחורה הועתקה!")).catch(()=>alert(txt));
        }}>📦 רשימת סחורה</button>
      </div>
      <div className="tb">{[["all","הכל"],["open","פתוחות"],["done","סופקו"]].map(([k,l])=>
        <button key={k} className={fl===k?"a":""} onClick={()=>setFl(k)}>{l}</button>)}</div>
      {orderSummary.items.length>0&&<div className="card" style={{borderColor:"var(--inf)",marginBottom:8}}>
        <div style={{fontWeight:700,fontSize:".83rem",marginBottom:4,color:"var(--inf)"}}>📊 סיכום הזמנות פתוחות</div>
        {orderSummary.items.map((item,i)=><div key={i} style={{fontSize:".78rem",display:"flex",justifyContent:"space-between",padding:"2px 0"}}>
          <span>{item.name}</span>
          <span style={{fontWeight:600}}>{item.cartons>0?`${item.cartons} קרטונים`:""}{item.cartons>0&&item.boxes>0?" + ":""}{item.boxes>0?`${item.boxes} קופסאות`:""}</span>
        </div>)}
        <div style={{borderTop:"1px solid var(--brd)",marginTop:4,paddingTop:4,display:"flex",justifyContent:"space-between",fontWeight:700}}>
          <span>סה"כ עלות</span><span style={{color:"var(--pri)"}}>{fmt(orderSummary.total)} | {fmt(calcVat(orderSummary.total))} כולל מע"מ</span>
        </div>
      </div>}
      {sorted.map(o=>{const c=gc(o.customerId);const activeI=o.items.filter(i=>+i.qty>0);const t=activeI.reduce((s,i)=>s+calcItemTotal(i,products),0);
        return(<div className="row" key={o.id} onClick={()=>openEdit("order",o)}>
          <div><div style={{fontWeight:600}}>{c?.name||"—"}</div>
            <div style={{fontSize:".68rem",color:"var(--txt3)"}}>{o.date}{o.expectedDate?` • צפי: ${fmtD(o.expectedDate)}`:""}</div></div>
          <div style={{textAlign:"left"}}><div style={{fontWeight:700,fontSize:".83rem"}}>{fmt(t)}</div>
            <span className={`badge ${sb(o.status)}`}>{o.status}</span></div>
        </div>)
      })}
      {sorted.length===0&&<div className="emp">אין הזמנות</div>}
    </div>);
  };

  // ======================== CUSTOMERS ========================
  const Customers=()=>{
    const[sr,setSr]=useState("");const[cityFl,setCityFl]=useState("all");const[distFl,setDistFl]=useState("all");
    const cities=useMemo(()=>{const s=new Set();customers.forEach(c=>{if(c.city)s.add(c.city)});return[...s].sort()},[customers]);
    const districts=useMemo(()=>{const s=new Set();customers.forEach(c=>{const d=getDistrict(c.city);if(d&&d!=="")s.add(d)});return[...s].sort()},[customers]);
    const filtered=useMemo(()=>{
      let r=customers;
      if(distFl!=="all")r=r.filter(c=>getDistrict(c.city)===distFl);
      if(cityFl!=="all")r=r.filter(c=>c.city===cityFl);
      if(sr)r=r.filter(c=>c.name.includes(sr));
      return [...r].sort((a,b)=>{
        const aLast=a.visits&&a.visits.length?a.visits[a.visits.length-1].date:"0000";
        const bLast=b.visits&&b.visits.length?b.visits[b.visits.length-1].date:"0000";
        return aLast.localeCompare(bLast);
      });
    },[customers,sr,cityFl,distFl]);
    return(<div className="fi">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <h3 style={{fontWeight:700}}>👥 לקוחות ({customers.length})</h3>
        <button className="btn btn-p btn-sm" onClick={()=>openNew("customer")}>+ לקוח</button>
      </div>
      <div className="sr"><input value={sr} onChange={e=>setSr(e.target.value)} placeholder="חיפוש לקוח..."/><span className="ic">🔍</span></div>
      {districts.length>0&&<div style={{marginBottom:6,overflowX:"auto",whiteSpace:"nowrap",display:"flex",gap:4}}>
        <span style={{fontSize:".7rem",color:"var(--txt3)",padding:"4px 0"}}>מחוז:</span>
        <button className={`btn btn-sm ${distFl==="all"?"btn-p":"btn-o"}`} onClick={()=>setDistFl("all")}>הכל</button>
        {districts.map(d=><button key={d} className={`btn btn-sm ${distFl===d?"btn-p":"btn-o"}`} onClick={()=>setDistFl(d)}>{d}</button>)}
      </div>}
      {cities.length>0&&<div style={{marginBottom:8,overflowX:"auto",whiteSpace:"nowrap",display:"flex",gap:4}}>

        <button className={`btn btn-sm ${cityFl==="all"?"btn-p":"btn-o"}`} onClick={()=>setCityFl("all")}>הכל</button>
        {cities.map(c=><button key={c} className={`btn btn-sm ${cityFl===c?"btn-p":"btn-o"}`} onClick={()=>setCityFl(c)}>{c}</button>)}
      </div>}
      {filtered.map(c=>{
        const cS=sales.filter(s=>s.customerId===c.id);
        const total=cS.reduce((s,sl)=>s+calcVat(calcSaleTotal(sl,products)),0);
        return(<div className="row" key={c.id} onClick={()=>openEdit("customer",c)}>
          <div><div style={{fontWeight:600}}>{c.name}</div>
            <div style={{fontSize:".68rem",color:"var(--txt3)"}}>{c.paymentTerms}{c.city?` • ${c.city}`:""}{getDistrict(c.city)?` • ${getDistrict(c.city)}`:""}</div>
            {c.visits&&c.visits.length>0&&<div style={{fontSize:".65rem",color:"var(--inf)"}}>ביקור אחרון: {fmtD(c.visits[c.visits.length-1].date)}</div>}
          </div>
          <div style={{textAlign:"left"}}><div style={{fontWeight:700,fontSize:".83rem"}}>{fmt(total)}</div><div style={{fontSize:".65rem",color:"var(--txt3)"}}>{cS.length} עסקאות</div></div>
        </div>)
      })}
    </div>);
  };

  // ======================== LEADS ========================
  const Leads=()=>{
    const[sr,setSr]=useState("");
    const filtered=leads.filter(l=>!sr||l.name.includes(sr));

      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <h3 style={{fontWeight:700}}>🎯 לידים ({leads.length})</h3>

      </div>
      <div className="sr"><input value={sr} onChange={e=>setSr(e.target.value)} placeholder="חיפוש ליד..."/><span className="ic">🔍</span></div>
      {filtered.map(l=><div className="row" key={l.id} onClick={()=>openEdit("lead",l)}>
        <div><div style={{fontWeight:600,fontSize:".83rem"}}>{l.name}</div>

          {l.visits&&l.visits.length>0&&<div style={{fontSize:".65rem",color:"var(--inf)"}}>ביקור אחרון: {fmtD(l.visits[l.visits.length-1].date)}</div>}
        </div>
        <span className={`badge ${sc[l.status]||"b-i"}`}>{l.status}</span>
      </div>)}
    </div>);

  // ======================== EXPENSES ========================
  const Expenses=()=>{
    const[openMonth,setOpenMonth]=useState(()=>{const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}`});
    const sorted=useMemo(()=>[...expenses].sort((a,b)=>b.date.localeCompare(a.date)),[expenses]);
    const months=useMemo(()=>{
      const m={};sorted.forEach(e=>{const k=e.date.slice(0,7);if(!m[k])m[k]=[];m[k].push(e)});
      return Object.entries(m).sort((a,b)=>b[0].localeCompare(a[0]));
    },[sorted]);
    const MN={"01":"ינואר","02":"פברואר","03":"מרץ","04":"אפריל","05":"מאי","06":"יוני","07":"יולי","08":"אוגוסט","09":"ספטמבר","10":"אוקטובר","11":"נובמבר","12":"דצמבר"};
    return(<div className="fi">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <h3 style={{fontWeight:700}}>💳 הוצאות ({expenses.length})</h3>
        <button className="btn btn-p btn-sm" onClick={()=>openNew("expense")}>+ הוצאה</button>
      </div>
      {months.map(([month,items])=>{
        const mTotal=items.reduce((s,e)=>s+e.amount,0);
        const isOpen=openMonth===month;
        return(<div key={month}>
          <div onClick={()=>setOpenMonth(isOpen?null:month)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 6px",background:"var(--bg)",borderRadius:8,marginBottom:4,cursor:"pointer",borderRight:isOpen?"3px solid var(--dan)":"3px solid transparent"}}>
            <span style={{fontWeight:700,fontSize:".85rem"}}>{MN[month.slice(5)]||month.slice(5)} {month.slice(0,4)}</span>
            <span style={{display:"flex",gap:8,alignItems:"center"}}><span style={{fontSize:".72rem",color:"var(--txt3)"}}>{items.length}</span><strong style={{color:"var(--dan)",fontSize:".85rem"}}>{fmt(mTotal)}</strong><span>{isOpen?"▲":"▼"}</span></span>
          </div>
          {isOpen&&items.map(e=>(<div className="row" key={e.id} onClick={()=>openEdit("expense",e)}>
            <div><div style={{fontWeight:600}}>{e.category}</div><div style={{fontSize:".7rem",color:"var(--txt3)"}}>{e.date}{e.description?` • ${e.description}`:""}</div></div>
            <div style={{textAlign:"left"}}><div style={{fontWeight:700,color:"var(--dan)"}}>{fmt(e.amount)}</div>
              <span className={`badge ${e.paid?"b-s":"b-d"}`}>{e.paid?"שולם":"לא שולם"}</span></div>
          </div>))}
        </div>)
      })}
    </div>);
  };

  // ======================== TASKS ========================
  const Tasks=()=>{
    const[newTask,setNewTask]=useState({text:"",date:new Date().toISOString().split("T")[0],done:false});
    const[editId,setEditId]=useState(null);
    const[editText,setEditText]=useState("");
    const[editDate,setEditDate]=useState("");
    const addTask=()=>{if(!newTask.text.trim())return;setTasks(p=>[...p,{...newTask,id:nxId(p)}]);setNewTask({text:"",date:new Date().toISOString().split("T")[0],done:false})};
    const toggle=(id)=>setTasks(p=>p.map(t=>t.id===id?{...t,done:!t.done}:t));
    const delTask=(id)=>setTasks(p=>p.filter(t=>t.id!==id));
    const startEdit=(t)=>{setEditId(t.id);setEditText(t.text);setEditDate(t.date)};
    const saveEdit=()=>{setTasks(p=>p.map(t=>t.id===editId?{...t,text:editText,date:editDate}:t));setEditId(null)};
    const open=tasks.filter(t=>!t.done).sort((a,b)=>a.date.localeCompare(b.date));
    const done=tasks.filter(t=>t.done);
    const today=new Date().toISOString().split("T")[0];
    return(<div className="fi">
      <h3 style={{fontWeight:700,marginBottom:8}}>✅ משימות ({open.length} פתוחות)</h3>
      <div className="card" style={{padding:8,marginBottom:8}}>
        <div className="g2">
          <div className="fg"><label>משימה</label><input value={newTask.text} onChange={e=>setNewTask(p=>({...p,text:e.target.value}))} placeholder="למשל: להזמין משטח..." onKeyDown={e=>{if(e.key==="Enter")addTask()}}/></div>
          <div className="fg"><label>תאריך</label><input type="date" value={newTask.date} onChange={e=>setNewTask(p=>({...p,date:e.target.value}))}/></div>
        </div>
        <button className="btn btn-p btn-sm" style={{width:"100%",marginTop:4}} onClick={addTask}>+ הוסף משימה</button>
        <div style={{display:"flex",gap:3,marginTop:3,flexWrap:"wrap"}}>
          {["הוצא חשבונית","הוצא קבלה","הכן הזמנה","אסוף תשלום","ביקור לקוח","הזמן משטח"].map(t=>
            <button key={t} className="btn btn-o" style={{fontSize:".6rem",padding:"2px 6px"}} onClick={()=>{setNewTask(p=>({...p,text:t}))}}>{t}</button>
          )}
        </div>
      </div>
      {open.map(t=><div key={t.id} className="row" style={{borderColor:t.date<=today?"var(--dan)":"var(--brd)"}}>
        {editId===t.id?<div style={{flex:1}}>
          <div className="g2">
            <input value={editText} onChange={e=>setEditText(e.target.value)} style={{fontSize:".82rem"}}/>
            <input type="date" value={editDate} onChange={e=>setEditDate(e.target.value)}/>
          </div>
          <div style={{display:"flex",gap:4,marginTop:4}}>
            <button className="btn btn-p btn-sm" onClick={saveEdit}>שמור</button>
            <button className="btn btn-o btn-sm" onClick={()=>setEditId(null)}>ביטול</button>
          </div>
        </div>:<>
        <div style={{display:"flex",alignItems:"center",gap:8,flex:1}} onClick={()=>toggle(t.id)}>
          <span style={{fontSize:"1.2rem",cursor:"pointer"}}>⬜</span>
          <div><div style={{fontWeight:600,fontSize:".82rem"}}>{t.text}</div>
            <div style={{fontSize:".68rem",color:t.date<=today?"var(--dan)":"var(--txt3)"}}>{fmtD(t.date)}</div></div>
        </div>
        <div style={{display:"flex",gap:2}}>
          <button className="btn btn-o btn-sm" onClick={()=>startEdit(t)}>✏️</button>
          <button className="btn btn-d btn-sm" onClick={()=>delTask(t.id)}>🗑️</button>
        </div></>}
      </div>)}
      {done.length>0&&<details style={{marginTop:8}}><summary style={{fontSize:".8rem",color:"var(--txt3)",cursor:"pointer"}}>הושלמו ({done.length})</summary>
        {done.map(t=><div key={t.id} className="row" style={{opacity:.5}}>
          <div style={{display:"flex",alignItems:"center",gap:8}} onClick={()=>toggle(t.id)}>
            <span style={{fontSize:"1.2rem",cursor:"pointer"}}>✅</span>
            <div style={{textDecoration:"line-through",fontSize:".82rem"}}>{t.text}</div>
          </div>
          <button className="btn btn-d btn-sm" onClick={()=>delTask(t.id)}>🗑️</button>
        </div>)}
      </details>}
    </div>);
  };

  // ======================== GEO ========================
  const Geo=()=>{
    const[distFl,setDistFl]=useState("all");
    const[cityFl,setCityFl]=useState("all");
    const[clusterFl,setClusterFl]=useState("all");
    const[editCluster,setEditCluster]=useState(null);
    const[newClName,setNewClName]=useState("");
    const[newClCities,setNewClCities]=useState("");
    const[selected,setSelected]=useState(new Set());
    const[routeStart,setRouteStart]=useState("");
    const[routeEnd,setRouteEnd]=useState("");

    const allBiz=useMemo(()=>{
      const items=[];
      customers.forEach(c=>items.push({...c,type:"customer",icon:"👥",typeName:"לקוח"}));
      leads.forEach(l=>items.push({...l,type:"lead",icon:"🎯",typeName:"ליד"}));
      return items;
    },[customers,leads]);

    const allCities=useMemo(()=>{const s=new Set();allBiz.forEach(b=>{if(b.city&&b.city.trim())s.add(b.city.trim())});return[...s].sort()},[allBiz]);
    const allDistricts=useMemo(()=>{const s=new Set();allBiz.forEach(b=>{const d=getDistrict(b.city);if(d)s.add(d)});return[...s].sort()},[allBiz]);

    const filtered=useMemo(()=>{
      let r=allBiz;
      if(clusterFl!=="all"){const cl=clusters.find(c=>c.name===clusterFl);if(cl)r=r.filter(b=>cl.cities.some(c=>b.city&&b.city.trim()===c))}
      if(distFl!=="all")r=r.filter(b=>getDistrict(b.city)===distFl);
      if(cityFl!=="all")r=r.filter(b=>b.city&&b.city.trim()===cityFl);
      return r;
    },[allBiz,distFl,cityFl,clusterFl,clusters]);

    const filteredCities=useMemo(()=>{
      if(distFl==="all"&&clusterFl==="all")return allCities;
      let cities=allCities;
      if(distFl!=="all")cities=cities.filter(c=>getDistrict(c)===distFl);
      if(clusterFl!=="all"){const cl=clusters.find(x=>x.name===clusterFl);if(cl)cities=cities.filter(c=>cl.cities.includes(c))}
      return cities;
    },[allCities,distFl,clusterFl,clusters]);

    const saveCluster=()=>{
      if(!newClName.trim())return;
      const cities=newClCities.split(",").map(c=>c.trim()).filter(Boolean);
      if(editCluster!==null)setClusters(p=>p.map((c,i)=>i===editCluster?{name:newClName,cities}:c));
      else setClusters(p=>[...p,{name:newClName,cities}]);
      setEditCluster(null);setNewClName("");setNewClCities("");
    };

    const toggleSelect=(key)=>{setSelected(p=>{const n=new Set(p);if(n.has(key))n.delete(key);else n.add(key);return n})};
    const selectAll=()=>{const keys=filtered.map(b=>`${b.type}-${b.id}`);setSelected(new Set(keys))};
    const clearAll=()=>setSelected(new Set());

    const searchCity=(city)=>{
      const q=encodeURIComponent(`חנויות חומרי בניין טמבוריות ${city}`);
      window.open(`https://www.google.com/maps/search/${q}`,"_blank");
    };

    const searchEasy=(city)=>{
      const q=encodeURIComponent(`חומרי בניין ${city}`);
      window.open(`https://www.easyco.co.il/search?q=${q}`,"_blank");
    };

    const buildRoute=(app)=>{
      const stops=filtered.filter(b=>selected.has(`${b.type}-${b.id}`));
      if(stops.length===0){alert("בחר לפחות עצירה אחת");return}
      const addrs=stops.map(b=>{
        if(b.lat&&b.lng)return `${b.lat},${b.lng}`;
        const parts=[];
        if(b.address&&b.address.trim())parts.push(b.address.trim());
        if(b.city&&b.city.trim())parts.push(b.city.trim());
        return parts.join(", ")||b.name;
      });
      if(app==="waze"&&stops.length===1){
        const b=stops[0];
        if(b.lat&&b.lng)window.open(`https://waze.com/ul?ll=${b.lat},${b.lng}&navigate=yes`,"_blank");
        else window.open(`https://waze.com/ul?q=${encodeURIComponent(addrs[0])}&navigate=yes`,"_blank");
        return;
      }
      const start=routeStart.trim()||addrs[0];
      const end=routeEnd.trim()||addrs[addrs.length-1];
      const mid=addrs.slice(routeStart.trim()?0:1,routeEnd.trim()?undefined:-1);
      let url=`https://www.google.com/maps/dir/${encodeURIComponent(start)}`;
      mid.forEach(w=>{url+=`/${encodeURIComponent(w)}`});
      url+=`/${encodeURIComponent(end)}`;
      window.open(url,"_blank");
    };

    const selectedCount=selected.size;

    return(<div className="fi">
      <h3 style={{fontWeight:700,marginBottom:8}}>🗺️ תצוגה גיאוגרפית ({filtered.length})</h3>

      {clusters.length>0&&<div style={{marginBottom:6,display:"flex",gap:4,flexWrap:"wrap"}}>
        <span style={{fontSize:".7rem",color:"var(--txt3)",padding:"4px 0"}}>אשכול:</span>
        <button className={`btn btn-sm ${clusterFl==="all"?"btn-p":"btn-o"}`} onClick={()=>{setClusterFl("all");setDistFl("all");setCityFl("all")}}>הכל</button>
        {clusters.map(c=><button key={c.name} className={`btn btn-sm ${clusterFl===c.name?"btn-p":"btn-o"}`} onClick={()=>{setClusterFl(c.name);setDistFl("all");setCityFl("all")}}>{c.name} ({c.cities.length})</button>)}
      </div>}
      <div style={{marginBottom:6,display:"flex",gap:4,flexWrap:"wrap"}}>
        <span style={{fontSize:".7rem",color:"var(--txt3)",padding:"4px 0"}}>מחוז:</span>
        <button className={`btn btn-sm ${distFl==="all"?"btn-p":"btn-o"}`} onClick={()=>{setDistFl("all");setCityFl("all")}}>הכל</button>
        {allDistricts.map(d=><button key={d} className={`btn btn-sm ${distFl===d?"btn-p":"btn-o"}`} onClick={()=>{setDistFl(d);setCityFl("all")}}>{d}</button>)}
      </div>
      {filteredCities.length>0&&<div style={{marginBottom:8,display:"flex",gap:4,flexWrap:"wrap",overflowX:"auto"}}>
        <span style={{fontSize:".7rem",color:"var(--txt3)",padding:"4px 0"}}>עיר:</span>
        <button className={`btn btn-sm ${cityFl==="all"?"btn-p":"btn-o"}`} onClick={()=>setCityFl("all")}>הכל</button>
        {filteredCities.map(c=><button key={c} className={`btn btn-sm ${cityFl===c?"btn-p":"btn-o"}`} onClick={()=>setCityFl(c)}>{c}</button>)}
      </div>}

      {cityFl!=="all"&&<div style={{marginBottom:8,display:"flex",gap:4,flexWrap:"wrap"}}>
        <button className="btn btn-o btn-sm" onClick={()=>searchCity(cityFl)}>🔍 חפש חנויות ב-Google Maps</button>
        <button className="btn btn-o btn-sm" onClick={()=>searchEasy(cityFl)}>🏪 חפש ב-Easy</button>
      </div>}

      <div style={{display:"flex",gap:4,marginBottom:6,flexWrap:"wrap",alignItems:"center"}}>
        <button className="btn btn-o btn-sm" onClick={selectAll}>☑️ בחר הכל</button>
        <button className="btn btn-o btn-sm" onClick={clearAll}>🔲 נקה</button>
        {selectedCount>0&&<span style={{fontSize:".78rem",fontWeight:600,color:"var(--pri)"}}>✓ {selectedCount} נבחרו</span>}
      </div>

      {filtered.map(b=>{
        const key=`${b.type}-${b.id}`;const isSel=selected.has(key);
        return(<div key={key} className="row" style={{borderColor:isSel?"var(--pri)":"var(--brd)",background:isSel?"rgba(37,99,235,.06)":"transparent"}}>
          <div style={{display:"flex",alignItems:"center",gap:8,flex:1}} onClick={()=>toggleSelect(key)}>
            <span style={{fontSize:"1.1rem",cursor:"pointer"}}>{isSel?"☑️":"⬜"}</span>
            <div><div style={{fontWeight:600,fontSize:".82rem"}}>{b.icon} {b.name}</div>
              <div style={{fontSize:".66rem",color:"var(--txt3)"}}>{b.typeName} • {b.city||"—"} • {getDistrict(b.city)||""}{b.phone?` • ${b.phone}`:""}</div></div>
          </div>
          <div style={{display:"flex",gap:2}}>
            {b.phone&&<a href={`tel:${b.phone}`} className="btn btn-o btn-sm" onClick={e=>e.stopPropagation()}>📞</a>}
            {(b.city||b.address)&&<button className="btn btn-o btn-sm" onClick={(e)=>{e.stopPropagation();const q=encodeURIComponent(`${b.address||""} ${b.city||""} ${b.name}`);window.open(`https://waze.com/ul?q=${q}&navigate=yes`,"_blank")}}>🚗</button>}
          </div>
        </div>)
      })}
      {filtered.length===0&&<div className="emp">אין עסקים לתצוגה</div>}

      {selectedCount>0&&<div className="card" style={{marginTop:8,borderColor:"var(--pri)"}}>
        <div style={{fontWeight:700,marginBottom:6}}>🚗 מסלול נסיעה ({selectedCount} עצירות)</div>
        <div className="g2">
          <div className="fg"><label>נקודת התחלה</label><input value={routeStart} onChange={e=>setRouteStart(e.target.value)} placeholder="עין קיניא (ריק=ראשון)"/></div>
          <div className="fg"><label>נקודת סיום</label><input value={routeEnd} onChange={e=>setRouteEnd(e.target.value)} placeholder="עין קיניא (ריק=אחרון)"/></div>
        </div>
        <div style={{display:"flex",gap:4,marginTop:6}}>
          <button className="btn btn-p btn-sm" style={{flex:1}} onClick={()=>buildRoute("gmaps")}>🗺️ Google Maps</button>
          <button className="btn btn-o btn-sm" style={{flex:1}} onClick={()=>{
            const stops=filtered.filter(b=>selected.has(`${b.type}-${b.id}`));
            if(!stops.length){alert("בחר עצירות");return}
            let txt="תכנן לי מסלול נסיעה יעיל בין הנקודות הבאות:\n";
            stops.forEach((b,i)=>{
              const addr=b.lat&&b.lng?`${b.lat},${b.lng}`:`${b.address||""} ${b.city||""} ${b.name}`.trim();
              txt+=`${i+1}. ${b.name} - ${addr}\n`;
            });
            if(routeStart.trim())txt+=`\nנקודת התחלה: ${routeStart}\n`;
            if(routeEnd.trim())txt+=`נקודת סיום: ${routeEnd}\n`;
            navigator.clipboard.writeText(txt).then(()=>alert("הועתק! הדבק ב-Gemini")).catch(()=>{
              const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);alert("הועתק! הדבק ב-Gemini");
            });
          }}>📋 העתק ל-Gemini</button>
          <button className="btn btn-p btn-sm" style={{flex:1}} onClick={()=>buildRoute("waze")}>🚗 Waze</button>
        </div>
      </div>}

      <details style={{marginTop:12}}><summary style={{fontWeight:700,fontSize:".85rem",cursor:"pointer"}}>⚙️ ניהול אשכולות</summary>
        <div className="card" style={{marginTop:6}}>
          <div className="g2">
            <div className="fg"><label>שם אשכול</label><input value={newClName} onChange={e=>setNewClName(e.target.value)} placeholder="למשל: פזורה"/></div>
            <div className="fg"><label>ערים (מופרדות בפסיק)</label><input value={newClCities} onChange={e=>setNewClCities(e.target.value)} placeholder="רהט, חורה, לקיה"/></div>
          </div>
          <div style={{display:"flex",gap:4,marginTop:4}}>
            <button className="btn btn-p btn-sm" onClick={saveCluster}>{editCluster!==null?"עדכן":"+ אשכול"}</button>
            {editCluster!==null&&<button className="btn btn-o btn-sm" onClick={()=>{setEditCluster(null);setNewClName("");setNewClCities("")}}>ביטול</button>}
          </div>
          {clusters.map((c,i)=><div key={i} className="row" style={{marginTop:4}}>
            <div><strong>{c.name}</strong><div style={{fontSize:".7rem",color:"var(--txt3)"}}>{c.cities.join(", ")}</div></div>
            <div style={{display:"flex",gap:4}}>
              <button className="btn btn-o btn-sm" onClick={()=>{setEditCluster(i);setNewClName(c.name);setNewClCities(c.cities.join(", "))}}>✏️</button>
              <button className="btn btn-d btn-sm" onClick={()=>setClusters(p=>p.filter((_,j)=>j!==i))}>🗑️</button>
            </div>
          </div>)}
        </div>
      </details>
    </div>);
  };

  // ======================== PLANNER ========================
  const Planner=()=>{
    const dayNames=["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
    const taskTypes=[{k:"visit",l:"ביקור",i:"👥"},{k:"delivery",l:"אספקה",i:"🚚"},{k:"collection",l:"גבייה",i:"💳"},{k:"other",l:"אחר",i:"📌"}];
    const[weekStart,setWeekStart]=useState(()=>{const d=new Date();d.setDate(d.getDate()-d.getDay());return d.toISOString().split("T")[0]});
    const[plan,setPlan]=useState(()=>ld("vnb13_planner",{}));
    useEffect(()=>{sv("vnb13_planner",plan)},[plan]);
    const days=Array.from({length:6},(_,i)=>{const d=new Date(weekStart);d.setDate(d.getDate()+i);return d.toISOString().split("T")[0]});
    const prevWeek=()=>{const d=new Date(weekStart);d.setDate(d.getDate()-7);setWeekStart(d.toISOString().split("T")[0])};
    const nextWeek=()=>{const d=new Date(weekStart);d.setDate(d.getDate()+7);setWeekStart(d.toISOString().split("T")[0])};
    const[addDay,setAddDay]=useState(null);
    const[addSr,setAddSr]=useState("");
    const[addType,setAddType]=useState("visit");
    const allBiz=[...customers.map(c=>({...c,bType:"customer",bIcon:"👥"})),...leads.map(l=>({...l,bType:"lead",bIcon:"🎯"}))].sort((a,b)=>a.name.localeCompare(b.name));
    const addToPlan=(day,biz)=>{
      const hasOrder=orders.some(o=>o.customerId===biz.id&&o.status!=="סופק");
      setPlan(p=>{const d=p[day]||[];if(d.some(x=>x.id===biz.id&&x.bType===biz.bType))return p;return{...p,[day]:[...d,{id:biz.id,bType:biz.bType,name:biz.name,city:biz.city||"",bIcon:biz.bIcon,taskType:addType,status:"planned",hasOrder,note:""}]}});
      setAddDay(null);setAddSr("");
    };
    const addFreeTask=(day,text)=>{
      if(!text.trim())return;
      setPlan(p=>({...p,[day]:[...(p[day]||[]),{id:Date.now(),bType:"task",name:text,city:"",bIcon:"📌",taskType:"other",status:"planned",note:""}]}));
    };
    const removeFromPlan=(day,idx)=>{setPlan(p=>({...p,[day]:(p[day]||[]).filter((_,i)=>i!==idx)}))};
    const toggleStatus=(day,idx)=>{
      setPlan(p=>{const d=[...(p[day]||[])];const item=d[idx];
        d[idx]={...item,status:item.status==="planned"?"done":item.status==="done"?"skipped":"planned"};
        return{...p,[day]:d}});
    };
    const getCargoForDay=(day)=>{
      const items=plan[day]||[];
      const custIds=items.filter(i=>i.bType==="customer").map(i=>i.id);
      const dayOrders=orders.filter(o=>custIds.includes(o.customerId)&&o.status!=="סופק");
      const cargo={};
      dayOrders.forEach(o=>o.items.forEach(i=>{
        if(+i.qty<=0)return;const p=gp(+i.productId);if(!p)return;
        if(!cargo[p.name])cargo[p.name]={cartons:0,boxes:0};
        if(i.unitType==="box")cargo[p.name].boxes+=+i.qty;else cargo[p.name].cartons+=+i.qty;
      }));
      return cargo;
    };
    const weekStats=useMemo(()=>{
      let total=0,done=0,skipped=0;
      days.forEach(day=>(plan[day]||[]).forEach(item=>{total++;if(item.status==="done")done++;if(item.status==="skipped")skipped++}));
      return{total,done,skipped,pct:total?Math.round(done/total*100):0};
    },[plan,days]);
    const[freeText,setFreeText]=useState("");
    const statusIcon=(s)=>s==="done"?"✅":s==="skipped"?"⏭️":"⬜";
    const statusColor=(s)=>s==="done"?"var(--suc)":s==="skipped"?"var(--txt3)":"var(--txt)";
    return(<div className="fi">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <button className="btn btn-o btn-sm" onClick={prevWeek}>→</button>
        <h3 style={{fontWeight:700,fontSize:".9rem"}}>📋 תוכנית שבועית</h3>
        <button className="btn btn-o btn-sm" onClick={nextWeek}>←</button>
      </div>
      <div style={{background:"var(--bg)",borderRadius:8,padding:8,marginBottom:8,display:"flex",justifyContent:"space-around",textAlign:"center"}}>
        <div><div style={{fontSize:".7rem",color:"var(--txt3)"}}>מתוכנן</div><strong>{weekStats.total}</strong></div>
        <div><div style={{fontSize:".7rem",color:"var(--txt3)"}}>בוצע</div><strong style={{color:"var(--suc)"}}>{weekStats.done}</strong></div>
        <div><div style={{fontSize:".7rem",color:"var(--txt3)"}}>דילוג</div><strong style={{color:"var(--txt3)"}}>{weekStats.skipped}</strong></div>
        <div><div style={{fontSize:".7rem",color:"var(--txt3)"}}>ביצוע</div><strong style={{color:weekStats.pct>=70?"var(--suc)":weekStats.pct>=40?"var(--warn)":"var(--dan)"}}>{weekStats.pct}%</strong></div>
      </div>
      {days.map(day=>{
        const d=new Date(day);const dayName=dayNames[d.getDay()];
        const items=plan[day]||[];
        const cargo=getCargoForDay(day);
        const hasCargo=Object.keys(cargo).length>0;
        const isToday=day===new Date().toISOString().split("T")[0];
        const dayDone=items.filter(x=>x.status==="done").length;
        const isPast=day<new Date().toISOString().split("T")[0];
        return(<div key={day} className="card" style={{marginBottom:6,borderColor:isToday?"var(--pri)":"var(--brd)",opacity:isPast&&!isToday?0.7:1}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
            <div><strong style={{fontSize:".85rem"}}>{dayName} {fmtD(day)}</strong>
              {items.length>0&&<span style={{fontSize:".65rem",marginRight:6,color:"var(--txt3)"}}>{dayDone}/{items.length}</span>}
            </div>
            <button className="btn btn-o btn-sm" onClick={()=>setAddDay(addDay===day?null:day)}>+ הוסף</button>
          </div>
          {addDay===day&&<div style={{marginBottom:6,background:"var(--bg)",borderRadius:6,padding:6}}>
            <div style={{display:"flex",gap:3,marginBottom:4,flexWrap:"wrap"}}>
              {taskTypes.map(t=><button key={t.k} className={`btn btn-sm ${addType===t.k?"btn-p":"btn-o"}`} style={{fontSize:".65rem"}} onClick={()=>setAddType(t.k)}>{t.i} {t.l}</button>)}
            </div>
            <input value={addSr} onChange={e=>setAddSr(e.target.value)} placeholder="חפש לקוח/ליד..." style={{fontSize:".8rem",marginBottom:4,width:"100%"}}/>
            <div style={{maxHeight:120,overflow:"auto"}}>
              {allBiz.filter(b=>!addSr||b.name.includes(addSr)).slice(0,12).map(b=>{
                const ho=orders.some(o=>o.customerId===b.id&&o.status!=="סופק");
                return <div key={`${b.bType}-${b.id}`} onClick={()=>addToPlan(day,b)} style={{fontSize:".73rem",padding:"3px 6px",cursor:"pointer",borderBottom:"1px solid var(--brd)",display:"flex",justifyContent:"space-between"}}><span>{b.bIcon} {b.name}</span><span style={{color:"var(--txt3)"}}>{b.city||""}{ho?" 📦":""}</span></div>
              })}
            </div>
            <div style={{display:"flex",gap:4,marginTop:4}}>
              <input value={freeText} onChange={e=>setFreeText(e.target.value)} placeholder="משימה חופשית..." style={{fontSize:".75rem",flex:1}}/>
              <button className="btn btn-o btn-sm" onClick={()=>{addFreeTask(day,freeText);setFreeText("")}}>+</button>
            </div>
          </div>}
          {items.map((item,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:6,padding:"3px 0",fontSize:".78rem",borderBottom:"1px solid var(--brd)",textDecoration:item.status==="skipped"?"line-through":"none",color:statusColor(item.status)}}>
            <span onClick={()=>toggleStatus(day,i)} style={{cursor:"pointer",fontSize:"1rem"}}>{statusIcon(item.status)}</span>
            <span style={{flex:1}}>{taskTypes.find(t=>t.k===item.taskType)?.i||"📌"} {item.name} {item.city?`(${item.city})`:""}{item.hasOrder?" 📦":""}</span>
            <button onClick={()=>removeFromPlan(day,i)} style={{background:"none",border:"none",cursor:"pointer",fontSize:".65rem",color:"var(--txt3)"}}>✕</button>
          </div>)}
          {items.length===0&&<div style={{fontSize:".72rem",color:"var(--txt3)"}}>ריק</div>}
          {hasCargo&&<details style={{marginTop:4}}><summary style={{fontSize:".7rem",color:"var(--pri)",cursor:"pointer"}}>📦 סחורה נדרשת</summary>
            {Object.entries(cargo).map(([name,q])=><div key={name} style={{fontSize:".68rem"}}>{name}: {q.cartons>0?q.cartons+" קרט\'":"" }{q.boxes>0?" "+q.boxes+" קופ\'":""}</div>)}
          </details>}
        </div>)
      })}
    </div>);
  };

  // ======================== CALENDAR ========================
  const Calendar=()=>{
    const[viewMonth,setViewMonth]=useState(()=>{const n=new Date();return`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}`});
    const[selectedDate,setSelectedDate]=useState(null);

    // Collect ALL events
    const events=useMemo(()=>{
      const ev=[];
      // Order deliveries
      orders.forEach(o=>{
        if(o.expectedDate&&o.status!=="סופק"){
          const c=gc(o.customerId);
          ev.push({date:o.expectedDate,type:"delivery",icon:"🚚",label:`אספקה: ${c?.name||"—"}`,color:"var(--inf)",data:o});
        }
      });
      // Customer visits
      customers.forEach(c=>{
        (c.visits||[]).forEach(v=>{
          ev.push({date:v.date,type:"customer_visit",icon:"👥",label:`ביקור: ${c.name}${v.note?` - ${v.note}`:""}`,color:"var(--suc)",data:c});
          if(v.nextVisit)ev.push({date:v.nextVisit,type:"customer_next",icon:"🔄",label:`ביקור הבא: ${c.name}`,color:"var(--warn)",data:c});
        });
      });
      // Lead visits
      leads.forEach(l=>{
        (l.visits||[]).forEach(v=>{
          ev.push({date:v.date,type:"lead_visit",icon:"🎯",label:`ביקור ליד: ${l.name}${v.note?` - ${v.note}`:""}`,color:"var(--pur)",data:l});
          if(v.nextVisit)ev.push({date:v.nextVisit,type:"lead_next",icon:"🔄",label:`ביקור הבא ליד: ${l.name}`,color:"var(--inf)",data:l});
        });
        if(l.followUp)ev.push({date:l.followUp,type:"lead_followup",icon:"📞",label:`מעקב ליד: ${l.name}`,color:"var(--warn)",data:l});
      });
      // Payment due dates
      sales.forEach(s=>{
        if(s.expectedPayDate&&s.status!=="שולם"){
          const c=gc(s.customerId);
          ev.push({date:s.expectedPayDate,type:"payment",icon:"💳",label:`תשלום צפוי: ${c?.name||"—"} ${fmt(calcVat(calcSaleTotal(s,products)))}`,color:"var(--warn)",data:s});
        }
      });
      // Tasks
      tasks.forEach(t=>{
        if(!t.done)ev.push({date:t.date,type:"task",icon:"✅",label:`משימה: ${t.text}`,color:"var(--dan)",data:t});
      });
      return ev;
    },[orders,customers,leads,tasks]);

    // Build calendar grid
    const[year,month]=viewMonth.split("-").map(Number);
    const firstDay=new Date(year,month-1,1);
    const lastDay=new Date(year,month,0);
    const startDay=firstDay.getDay();
    const daysInMonth=lastDay.getDate();
    const today=new Date().toISOString().split("T")[0];
    const monthName=firstDay.toLocaleDateString("he-IL",{month:"long",year:"numeric"});

    const prevMonth=()=>{const d=new Date(year,month-2,1);setViewMonth(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`)};
    const nextMonth=()=>{const d=new Date(year,month,1);setViewMonth(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`)};

    const getEventsForDate=(d)=>{
      const ds=`${year}-${String(month).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      return events.filter(e=>e.date===ds);
    };

    const selectedEvents=selectedDate?events.filter(e=>e.date===selectedDate):[];

    // Upcoming events (next 14 days)
    const upcoming=useMemo(()=>{
      const now=new Date();const in14=new Date();in14.setDate(now.getDate()+14);
      return events.filter(e=>{const d=new Date(e.date);return d>=now&&d<=in14}).sort((a,b)=>a.date.localeCompare(b.date));
    },[events]);

    return(<div className="fi">
      <h3 style={{fontWeight:700,marginBottom:8}}>📅 יומן</h3>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <button className="btn btn-o btn-sm" onClick={prevMonth}>&lt;</button>
        <strong style={{fontSize:".95rem"}}>{monthName}</strong>
        <button className="btn btn-o btn-sm" onClick={nextMonth}>&gt;</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,marginBottom:8}}>
        {["א","ב","ג","ד","ה","ו","ש"].map(d=><div key={d} style={{textAlign:"center",fontSize:".68rem",color:"var(--txt3)",padding:2}}>{d}</div>)}
        {Array.from({length:startDay},(_,i)=><div key={`e${i}`}/>)}
        {Array.from({length:daysInMonth},(_,i)=>{
          const day=i+1;
          const ds=`${year}-${String(month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
          const dayEvents=getEventsForDate(day);
          const isToday=ds===today;
          const isSel=ds===selectedDate;
          return(<div key={day} onClick={()=>setSelectedDate(ds===selectedDate?null:ds)} style={{
            textAlign:"center",padding:"4px 0",borderRadius:8,cursor:"pointer",fontSize:".8rem",
            background:isSel?"var(--pri)":isToday?"var(--card)":"transparent",
            color:isSel?"#000":isToday?"var(--pri)":"var(--txt)",
            border:isToday&&!isSel?"1px solid var(--pri)":"1px solid transparent",
            fontWeight:isToday||isSel?700:400,position:"relative"
          }}>
            {day}
            {dayEvents.length>0&&<div style={{display:"flex",justifyContent:"center",gap:1,marginTop:1}}>
              {dayEvents.slice(0,3).map((e,j)=><div key={j} style={{width:4,height:4,borderRadius:2,background:e.color}}/>)}
            </div>}
          </div>);
        })}
      </div>
      {selectedDate&&<div className="card" style={{borderColor:"var(--pri)",marginBottom:8}}>
        <div style={{fontWeight:700,fontSize:".85rem",marginBottom:4}}>{fmtD(selectedDate)}</div>
        {selectedEvents.length===0?<div style={{fontSize:".78rem",color:"var(--txt3)"}}>אין אירועים</div>:
        selectedEvents.map((e,i)=><div key={i} style={{fontSize:".8rem",padding:"3px 0",display:"flex",alignItems:"center",gap:6}}>
          <span>{e.icon}</span><span style={{color:e.color}}>{e.label}</span>
        </div>)}
      </div>}
      {upcoming.length>0&&<div className="card">
        <div style={{fontWeight:700,fontSize:".85rem",marginBottom:6}}>🔜 קרוב (14 יום)</div>
        {upcoming.map((e,i)=><div key={i} style={{fontSize:".78rem",padding:"3px 0",display:"flex",alignItems:"center",gap:6,borderBottom:"1px solid var(--brd)"}}>
          <span>{e.icon}</span>
          <span style={{color:"var(--txt2)",minWidth:55}}>{fmtD(e.date)}</span>
          <span style={{color:e.color}}>{e.label}</span>
        </div>)}
      </div>}
      {upcoming.length===0&&!selectedDate&&<div className="emp">אין אירועים קרובים</div>}
    </div>);
  };

  // ======================== REPORTS ========================
  const buildWeeklyReport=()=>{
    const today=new Date();const weekAgo=new Date(today-7*86400000);
    const ws=weekAgo.toISOString().split("T")[0];
    const weekSales=sales.filter(s=>s.date>=ws);
    const weekTotal=weekSales.reduce((s,sl)=>s+calcVat(calcSaleTotal(sl,products)),0);
    const weekCartons=weekSales.reduce((s,sl)=>s+sl.items.reduce((a,i)=>a+(i.unitType==="carton"?+i.qty:0),0),0);
    const newCusts=customers.filter(c=>c.id>Math.max(...customers.filter(x=>sales.some(s=>s.customerId===x.id&&s.date<ws)).map(x=>x.id),0));
    const unpaid=sales.filter(s=>s.status!=="שולם");
    const totalDebt=unpaid.reduce((s,sl)=>s+calcVat(calcSaleTotal(sl,products))-((+sl.paid)||0),0);
    const openOrders=orders.filter(o=>o.status!=="סופק");
    let txt=`📊 *דוח שבועי VNB*\n`;
    txt+=`${fmtD(ws)} - ${fmtD(today.toISOString().split("T")[0])}\n\n`;
    txt+=`👥 *לקוחות:* ${customers.length} | חדשים השבוע: ${newCusts.length}\n`;
    txt+=`🎯 *לידים:* ${leads.length}\n`;
    txt+=`💰 *מכירות השבוע:* ${weekSales.length} עסקאות\n`;
    txt+=`   סה"כ: ${fmt(weekTotal)} כולל מע"מ\n`;
    txt+=`   ${weekCartons} קרטונים\n`;
    txt+=`💳 *חוב פתוח:* ${fmt(totalDebt)}\n`;
    txt+=`📋 *הזמנות פתוחות:* ${openOrders.length}\n`;
    txt+=`📦 *מלאי:*\n`;
    products.forEach(p=>{const sd=stockData.find(x=>x.id===p.id);if(sd)txt+=`  ${p.name}: ${sd.pallets} משט' + ${sd.cartons} קרט'\n`});
    return txt;
  };
  const Reports=()=>{
    // Top customers
    const topCust=useMemo(()=>{
      const m={};sales.forEach(s=>{m[s.customerId]=(m[s.customerId]||0)+calcVat(calcSaleTotal(s,products))});
      return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([id,total])=>({customer:gc(+id),total}));
    },[sales,products]);
    // Top products
    const topProd=useMemo(()=>{
      const m={};sales.forEach(s=>s.items.forEach(i=>{m[i.productId]=(m[i.productId]||0)+calcItemTotal(i,products)}));
      return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([id,total])=>({product:gp(+id),total}));
    },[sales,products]);
    // Debts
    const debts=useMemo(()=>{
      const m={};sales.filter(s=>s.status!=="שולם").forEach(s=>{
        const debt=calcVat(calcSaleTotal(s,products))-(s.paid||0);
        m[s.customerId]=(m[s.customerId]||0)+debt;
      });
      return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([id,debt])=>({customer:gc(+id),debt}));
    },[sales,products]);
    return(<div className="fi">
      <h3 style={{fontWeight:700,marginBottom:10}}>📊 דוחות</h3>
      <div className="card"><div style={{fontWeight:700,marginBottom:6}}>🏆 לקוחות מובילים</div>
        {topCust.map((r,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",padding:"3px 0",fontSize:".82rem"}}>
          <span>{i+1}. {r.customer?.name||"—"}</span><strong>{fmt(r.total)}</strong>
        </div>)}
      </div>
      <div className="card"><div style={{fontWeight:700,marginBottom:6}}>📦 מוצרים מובילים</div>
        {topProd.map((r,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",padding:"3px 0",fontSize:".82rem"}}>
          <span>{r.product?.name||"—"}</span><strong>{fmt(r.total)}</strong>
        </div>)}
      </div>
      <div className="card" style={{borderColor:"var(--dan)"}}><div style={{fontWeight:700,marginBottom:6,color:"var(--dan)"}}>💸 דוח חובות</div>
        {debts.length===0?<div className="emp">אין חובות</div>:
        debts.map((r,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",padding:"3px 0",fontSize:".82rem"}}>
          <span>{r.customer?.name||"—"}</span><strong style={{color:"var(--dan)"}}>{fmt(r.debt)}</strong>
        </div>)}
      </div>
    </div>);
  };

  // ======================== SETTINGS ========================
  const Settings=()=>{
    const ir=useRef(null);const bk=ld("vnb13_bk",[]);
    return(<div className="fi">
      <h3 style={{fontWeight:700,marginBottom:12}}>⚙️ הגדרות</h3>
      <div className="card" style={{background:"linear-gradient(135deg,#1a2a1a,#1a1f2b)"}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:"1.2rem"}}>✅</span><div><div style={{fontWeight:700}}>שמירה אוטומטית</div><div style={{fontSize:".75rem",color:"var(--txt2)"}}>גיבוי יומי • 7 גרסאות</div></div></div>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:6}}>
        <button className="btn btn-p" style={{width:"100%"}} onClick={expD}>💾 ייצוא גיבוי</button>
        <button className="btn btn-o" style={{width:"100%"}} onClick={()=>ir.current?.click()}>📥 ייבוא גיבוי</button>
        <input ref={ir} type="file" accept=".json" onChange={impD} style={{display:"none"}}/>
        <button className="btn btn-w" style={{width:"100%"}} onClick={()=>{
          const data={products,inventory,customers,sales,leads,expenses,orders,tasks,clusters};
          const json=JSON.stringify(data);
          const blob=new Blob([json],{type:"application/json"});

          URL.revokeObjectURL(url);
          alert("הקובץ ירד. שלח אותו לשותף ב-WhatsApp.\nהוא צריך ללחוץ 📥 ייבוא גיבוי בהגדרות.");
        }}>📤 הורד גיבוי לשיתוף עם שותף</button>
      </div>
      {bk.length>0&&<div className="card" style={{marginTop:8}}>
        <div style={{fontWeight:600,marginBottom:4}}>🔄 גיבויים ({bk.length})</div>
        {bk.map((b,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:4,borderBottom:"1px solid var(--brd)"}}>
          <div><div style={{fontSize:".75rem"}}>{b.type==="auto"?"🕐 אוטומטי":"🔄 לפני פעולה"}</div><div style={{fontSize:".65rem",color:"var(--txt3)"}}>{new Date(b.date).toLocaleString("he-IL")}</div></div>
          <button className="btn btn-o btn-sm" onClick={()=>restoreB(i)}>שחזר</button>
        </div>)}
      </div>}
